name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  linux:
    name: linux ${{ matrix.compiler.name }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13,    cc: gcc-13,    cxx: g++-13,     pkgs: g++-13 }
          - { name: gcc-14,    cc: gcc-14,    cxx: g++-14,     pkgs: g++-14 }
          - { name: clang-17,  cc: clang-17,  cxx: clang++-17, pkgs: clang-17 }
          - { name: clang-18,  cc: clang-18,  cxx: clang++-18, pkgs: clang-18 }
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler.pkgs }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build -j2 --output-on-failure

  install-smoke:
    # Catches install/export regressions: configure with MULTI_INSTALL=ON,
    # `cmake --install` to a staging prefix, then build the fixture under
    # test/install against the staged package via `find_package(multi CONFIG)`.
    # The fixture (consumer.cpp) probes the generated version header and
    # touches each major dispatch shape, so a broken install graph
    # (missing INTERFACE_INCLUDE_DIRECTORIES, missing alias, missing
    # version.h, etc.) fails the build or the smoke check.
    name: install + downstream find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMULTI_BUILD_TESTING=OFF -DMULTI_BUILD_BENCHMARK=OFF -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/_stage
      - name: Build
        run: cmake --build build -j
      - name: Install
        run: cmake --install build
      - name: Configure downstream consumer
        run: cmake -S test/install -B test/install/build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/_stage
      - name: Build consumer
        run: cmake --build test/install/build -j
      - name: Run consumer
        run: ./test/install/build/consumer

  linux-asan:
    name: linux clang-18 asan+ubsan
    runs-on: ubuntu-latest
    env:
      CC: clang-18
      CXX: clang++-18
      # halt_on_error: surface the first violation immediately instead of
      # letting later tests run against a corrupted state.
      # print_stacktrace: UBSan reports include the offending call site.
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
      - name: Configure
        # Catches a different class of bug than the TSan job below: lifetime
        # bugs / use-after-move / OOB in the Task SBO memcpy / signed
        # overflow in chunking math / alignment violations. ASan and TSan
        # are mutually exclusive at link time, so they live in separate jobs.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build -j2 --output-on-failure

  linux-tsan:
    name: linux clang-18 tsan
    runs-on: ubuntu-latest
    env:
      CC: clang-18
      CXX: clang++-18
      # halt_on_error: surface the first race immediately (default would let
      # the run continue and bury the report in noise).
      # second_deadlock_stack: capture both stacks of a lock-order inversion
      # so we can see which call site flipped the order.
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18
      - name: Configure
        # Debug + -O1: -O1 is the TSan-recommended opt level — fast enough
        # to actually exercise concurrency, slow enough to keep stack frames.
        # Higher optimisation can collapse the per-task wrapper lambdas that
        # the lock-free deque tests rely on for race coverage.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build -j2 --output-on-failure

  macos:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build -j2 --output-on-failure

  android:
    # Build-only cross-compile: catches header/toolchain breakage on the NDK.
    # Runtime tests would require an emulator (see WORK.md stretch goal); the
    # value here is "does it still compile against the Android STL/libc++".
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # ANDROID_NDK_LATEST_HOME is set on GitHub-hosted ubuntu runners.
        # Tests/bench off: cross-compiled binaries can't be discovered/run on
        # the host, and Catch2's catch_discover_tests would try.
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_LATEST_HOME}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-21
          -DCMAKE_BUILD_TYPE=Release
          -DMULTI_BUILD_TESTING=OFF
          -DMULTI_BUILD_BENCHMARK=OFF
          -DMULTI_INSTALL=OFF
      - name: Build
        run: cmake --build build -j

  ios:
    # Build-only cross-compile for arm64 device. Same rationale as android:
    # catches toolchain/SDK breakage without the simulator-launch flakiness
    # that a real test run would bring.
    name: ios arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_BUILD_TYPE=Release
          -DMULTI_BUILD_TESTING=OFF
          -DMULTI_BUILD_BENCHMARK=OFF
          -DMULTI_INSTALL=OFF
      - name: Build
        run: cmake --build build -j

  windows:
    name: ${{ matrix.os }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j
      - name: Test
        run: ctest --test-dir build -j2 --output-on-failure -C ${{ matrix.build_type }}
